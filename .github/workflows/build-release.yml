name: build-release

# 构建 Typefree 并发 Release：
# - push main / 手动触发：测试 + 构建 + 打 DMG，产物只传 artifact（不发版）
# - push v* tag：以上全部 + 创建 GitHub Release（版本 = tag 名）
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # tag 触发时 gh release create 需要

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test, build & package (macos-26)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # 核心库单测先行：失败即止，不产出任何构建物。
      # 失败原因用 ::error 发成注解（Actions 日志需要登录才能看，注解在 API 里公开可读）
      - name: Core unit tests
        working-directory: mac/VoicePolishCore
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/swift-test.log" || {
            grep -E "error:|Fatal error|failed \(" "$RUNNER_TEMP/swift-test.log" | sort -u | head -8 \
              | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }

      # 无证书构建：工程 Release 配置绑定了作者的 Automatic 签名团队，
      # CI 上没有证书 → 用 CODE_SIGNING_ALLOWED=NO 编出未签名 app，随后由脚本 ad hoc 补签
      - name: Build Typefree.app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project mac/VoicePolish.xcodeproj \
            -scheme VoicePolish \
            -configuration Release \
            -derivedDataPath mac/.build-ci \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" || {
            grep -E "error: " "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -8 \
              | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }

      - name: Derive version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="ci-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Ad-hoc sign & package DMG
        run: |
          bash mac/scripts/release_dmg.sh \
            mac/.build-ci/Build/Products/Release/Typefree.app \
            "dist/Typefree-${VERSION}-arm64.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Typefree-${{ env.VERSION }}-arm64
          path: dist/*.dmg
          if-no-files-found: error

      # 仅 tag 触发发版；gh 与 GITHUB_TOKEN 均为 runner 内置。
      # 重跑同一 tag 时 create 会撞「已存在」，降级为往现有 Release 补传产物（幂等）。
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
          || gh release upload "$GITHUB_REF_NAME" dist/*.dmg --repo "$GITHUB_REPOSITORY" --clobber

      # 发版后签名 DMG 并把 appcast 提交回 main（Sparkle 更新源 + 更新历史数据源）。
      # [skip ci] 防止这次回写再触发一轮 main 构建。私钥在仓库 Secret：SPARKLE_PRIVATE_KEY。
      - name: Publish appcast
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::缺少 Secret SPARKLE_PRIVATE_KEY（64B seed||pub 的 base64）。请到仓库 Settings → Secrets and variables → Actions 配置后重跑本工作流。"
            exit 1
          fi
          # 说明文本：优先 tag 注释，轻量 tag 回落到 tag 提交的说明
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | head -40 > /tmp/notes.txt
          [ -s /tmp/notes.txt ] || git log -1 --pretty=%B > /tmp/notes.txt
          # appcast 里的版本必须与 Info.plist 的 CFBundleVersion 同格式（不带 v 前缀）：
          # Sparkle 的版本比较器把 v 前缀串判为更旧，会永远提示「无更新」。文件名/URL 里的 v 保留。
          APP_VERSION="${GITHUB_REF_NAME#v}"
          DMG="dist/Typefree-${VERSION}-arm64.dmg"
          bash mac/scripts/make_appcast.sh "$DMG" "$APP_VERSION" /tmp/notes.txt \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Typefree-${VERSION}-arm64.dmg" \
            appcast.xml
          # 提交回 main（种子文件已存在时要带 sha）。GITHUB_TOKEN 的提交本就不会触发工作流，
          # [skip ci] 只是双保险。
          BASE64="$(base64 -i appcast.xml | tr -d '\n')"
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/appcast.xml" --jq '.sha' 2>/dev/null || true)"
          ARGS=(--method PUT --field "message=chore(appcast): $GITHUB_REF_NAME [skip ci]" --field "content=$BASE64")
          [ -n "$SHA" ] && ARGS+=(--field "sha=$SHA")
          gh api "repos/$GITHUB_REPOSITORY/contents/appcast.xml" "${ARGS[@]}" --jq '.commit.html_url'
